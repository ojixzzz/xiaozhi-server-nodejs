name: Check and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm ci
      - name: Install announcement audio runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv ffmpeg ca-certificates
          python3 -m venv /opt/edge-tts
          /opt/edge-tts/bin/pip install --no-cache-dir edge-tts==7.2.8
      - run: npm run check
      - run: npm test
