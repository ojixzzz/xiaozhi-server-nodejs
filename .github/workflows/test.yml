name: Check and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run check
      - run: npm test
